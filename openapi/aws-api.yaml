openapi: 3.0.3
info:
  title: Calorie Compass AWS API
  version: 0.1.0
  description: Minimal authenticated API contract for Cognito + API Gateway + Lambda.
servers:
  - url: https://jfd1wc60og.execute-api.eu-south-2.amazonaws.com
security:
  - bearerAuth: []
paths:
  /me:
    get:
      operationId: getMe
      summary: Returns authenticated user claims
      responses:
        '200':
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /foods:
    get:
      operationId: getFoods
      summary: Lists foods for authenticated user
      responses:
        '200':
          description: User foods
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Food'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createFood
      summary: Creates a food for authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFoodRequest'
      responses:
        '201':
          description: Food created
          content:
            application/json:
              schema:
                type: object
                required:
                  - item
                properties:
                  item:
                    $ref: '#/components/schemas/Food'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /foods/{id}:
    put:
      operationId: updateFood
      summary: Updates a food for authenticated user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFoodRequest'
      responses:
        '200':
          description: Food updated
          content:
            application/json:
              schema:
                type: object
                required:
                  - item
                properties:
                  item:
                    $ref: '#/components/schemas/Food'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: deleteFood
      summary: Deletes a food if not used by recipes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Food deletion result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteFoodResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /foods/barcode/{barcode}:
    get:
      operationId: getFoodByBarcode
      summary: Looks up a product by barcode for authenticated user
      parameters:
        - name: barcode
          in: path
          required: true
          schema:
            type: string
            pattern: '^(\d{8}|\d{12}|\d{13})$'
      responses:
        '200':
          description: Product already exists or found with complete macros
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BarcodeLookupExistsResponse'
                  - $ref: '#/components/schemas/GetFoodByBarcode200'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Product found but nutriments are incomplete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFoodByBarcode422'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /favorites:
    get:
      operationId: getFavorites
      summary: Lists favorite recipes for authenticated user
      responses:
        '200':
          description: User favorite recipes
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/FavoriteDish'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createFavorite
      summary: Creates a favorite recipe for authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFavoriteDishRequest'
      responses:
        '201':
          description: Favorite recipe created
          content:
            application/json:
              schema:
                type: object
                required:
                  - item
                properties:
                  item:
                    $ref: '#/components/schemas/FavoriteDish'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /favorites/{id}:
    get:
      operationId: getFavoriteById
      summary: Gets favorite recipe detail for authenticated user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Favorite recipe detail
          content:
            application/json:
              schema:
                type: object
                required:
                  - item
                properties:
                  item:
                    $ref: '#/components/schemas/FavoriteDish'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: deleteFavorite
      summary: Deletes a favorite recipe for authenticated user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Favorite recipe deleted
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /logs:
    get:
      operationId: getLogs
      summary: Lists meal log entries for a date range for authenticated user
      parameters:
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: User meal log entries
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MealLogEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createLog
      summary: Creates a meal log entry for authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMealLogRequest'
      responses:
        '201':
          description: Meal log created
          content:
            application/json:
              schema:
                type: object
                required:
                  - item
                properties:
                  item:
                    $ref: '#/components/schemas/MealLogEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /logs/dashboard:
    get:
      operationId: getDashboard
      summary: Returns today's dashboard summary for authenticated user
      responses:
        '200':
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /uploads/presign:
    post:
      operationId: getUploadPresignUrl
      summary: Generates a presigned S3 upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fileName
                - contentType
                - pathPrefix
              properties:
                fileName:
                  type: string
                contentType:
                  type: string
                pathPrefix:
                  type: string
                  enum:
                    - meals
                    - labels
      responses:
        '200':
          description: Presigned S3 upload URL details
          content:
            application/json:
              schema:
                type: object
                required:
                  - uploadUrl
                  - key
                properties:
                  uploadUrl:
                    type: string
                  key:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /ai/suggestions:
    post:
      operationId: getAiSuggestions
      summary: Gets food suggestions based on user context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiSuggestionRequest'
      responses:
        '200':
          description: Suggestions response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSuggestionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /ai/recipe-drafts:
    post:
      operationId: createAiRecipeDraft
      summary: Creates an AI recipe draft from a suggestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecipeDraftRequest'
      responses:
        '200':
          description: Generated recipe draft details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRecipeDraftResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /ai/scan-label:
    post:
      operationId: scanNutritionLabel
      summary: Scans a nutrition label using Gemini
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - imageKey
              properties:
                imageKey:
                  type: string
      responses:
        '200':
          description: Scanned label results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanNutritionLabelResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /ai/analyze-meal:
    post:
      operationId: analyzeMealImage
      summary: Analyzes a meal image using Gemini and crosses it with user catalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - imageKey
              properties:
                imageKey:
                  type: string
                foodsCatalog:
                  type: array
                  items:
                    $ref: '#/components/schemas/Food'
      responses:
        '200':
          description: Analyzed meal results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeMealImageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GatewayTimeout:
      description: Upstream timeout
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateFoodConflictResponse'

  schemas:
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string

    MacroNutrients:
      type: object
      required:
        - calories
        - protein
        - carbs
        - fats
      properties:
        calories:
          type: number
        protein:
          type: number
        carbs:
          type: number
        fats:
          type: number

    MacroNutrientsNullable:
      type: object
      required:
        - calories
        - protein
        - carbs
        - fats
      properties:
        calories:
          type: number
          nullable: true
        protein:
          type: number
          nullable: true
        carbs:
          type: number
          nullable: true
        fats:
          type: number
          nullable: true

    Supermarket:
      type: string
      enum:
        - carrefour
        - mercadona
        - lidl
        - aldi
        - eroski

    MeasurementUnit:
      type: string
      enum:
        - g

    FavoriteDishDifficulty:
      type: string
      enum:
        - Facil
        - Media
        - Alta

    FavoriteDishItem:
      type: object
      required:
        - foodId
        - quantity
      properties:
        foodId:
          type: string
        quantity:
          type: number
          minimum: 0.1

    MealLogSource:
      type: string
      enum:
        - manual
        - favorite
        - visual-analysis

    MealLogEntry:
      type: object
      required:
        - id
        - userId
        - consumedAt
        - source
        - total
      properties:
        id:
          type: string
        userId:
          type: string
        consumedAt:
          type: string
          format: date-time
        source:
          $ref: '#/components/schemas/MealLogSource'
        total:
          $ref: '#/components/schemas/MacroNutrients'
        favoriteDishId:
          type: string
        notes:
          type: string

    CreateMealLogRequest:
      type: object
      required:
        - source
        - total
      properties:
        source:
          $ref: '#/components/schemas/MealLogSource'
        total:
          $ref: '#/components/schemas/MacroNutrients'
        favoriteDishId:
          type: string
        notes:
          type: string
        consumedAt:
          type: string
          format: date-time

    DashboardSummary:
      type: object
      required:
        - entries
        - totals
        - budget
        - remainingCalories
        - remainingProtein
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/MealLogEntry'
        totals:
          $ref: '#/components/schemas/MacroNutrients'
        budget:
          type: number
        remainingCalories:
          type: number
        remainingProtein:
          type: number

    FavoriteDish:
      type: object
      required:
        - id
        - userId
        - name
        - description
        - imageUri
        - prepMinutes
        - difficulty
        - servings
        - tags
        - steps
        - items
        - createdAt
      properties:
        id:
          type: string
        userId:
          type: string
        name:
          type: string
        description:
          type: string
        imageUri:
          type: string
        prepMinutes:
          type: number
        difficulty:
          $ref: '#/components/schemas/FavoriteDishDifficulty'
        servings:
          type: number
        tags:
          type: array
          items:
            type: string
        steps:
          type: array
          items:
            type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/FavoriteDishItem'
        createdAt:
          type: string
          format: date-time

    CreateFavoriteDishRequest:
      type: object
      required:
        - name
        - description
        - imageUri
        - prepMinutes
        - difficulty
        - servings
        - tags
        - steps
        - items
      properties:
        name:
          type: string
        description:
          type: string
        imageUri:
          type: string
        prepMinutes:
          type: number
          minimum: 0
        difficulty:
          $ref: '#/components/schemas/FavoriteDishDifficulty'
        servings:
          type: number
          minimum: 0.1
        tags:
          type: array
          items:
            type: string
        steps:
          type: array
          items:
            type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/FavoriteDishItem'

    Food:
      type: object
      required:
        - id
        - name
        - referenceAmount
        - referenceUnit
        - referenceMacros
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        name:
          type: string
        referenceAmount:
          type: number
          example: 100
        referenceUnit:
          $ref: '#/components/schemas/MeasurementUnit'
        referenceMacros:
          $ref: '#/components/schemas/MacroNutrients'
        defaultServingAmount:
          type: number
          nullable: true
        barcode:
          type: string
          nullable: true
        brand:
          type: string
          nullable: true
        supermarket:
          allOf:
            - $ref: '#/components/schemas/Supermarket'
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateFoodRequest:
      type: object
      required:
        - name
        - referenceAmount
        - referenceMacros
      properties:
        name:
          type: string
        referenceAmount:
          type: number
          minimum: 0.1
        barcode:
          type: string
          pattern: '^(\d{8}|\d{12}|\d{13})$'
        brand:
          type: string
        referenceMacros:
          $ref: '#/components/schemas/MacroNutrients'
        defaultServingAmount:
          type: number
          minimum: 0.1
        supermarket:
          allOf:
            - $ref: '#/components/schemas/Supermarket'
          nullable: true

    CreateFoodConflictResponse:
      type: object
      required:
        - message
        - barcode
        - existingFoodId
        - existingFoodName
      properties:
        message:
          type: string
        barcode:
          type: string
        existingFoodId:
          type: string
        existingFoodName:
          type: string

    UpdateFoodRequest:
      type: object
      required:
        - name
        - referenceAmount
        - referenceMacros
      properties:
        name:
          type: string
        referenceAmount:
          type: number
          minimum: 0.1
        barcode:
          type: string
          pattern: '^(\d{8}|\d{12}|\d{13})$'
        brand:
          type: string
        referenceMacros:
          $ref: '#/components/schemas/MacroNutrients'
        defaultServingAmount:
          type: number
          minimum: 0.1
        supermarket:
          allOf:
            - $ref: '#/components/schemas/Supermarket'
          nullable: true

    BarcodeLookupItem:
      type: object
      required:
        - barcode
        - detectedName
        - referenceAmount
        - referenceUnit
        - referenceMacros
        - source
        - fetchedAt
        - confidence
      properties:
        barcode:
          type: string
        detectedName:
          type: string
        brand:
          type: string
          nullable: true
        referenceAmount:
          type: number
          example: 100
        referenceUnit:
          $ref: '#/components/schemas/MeasurementUnit'
        referenceMacros:
          $ref: '#/components/schemas/MacroNutrients'
        source:
          type: string
          enum:
            - openfoodfacts
        fetchedAt:
          type: string
          format: date-time
        confidence:
          type: number

    BarcodeLookupItemIncomplete:
      allOf:
        - $ref: '#/components/schemas/BarcodeLookupItem'
        - type: object
          properties:
            referenceMacros:
              $ref: '#/components/schemas/MacroNutrientsNullable'

    BarcodeLookupExistsResponse:
      type: object
      required:
        - status
        - barcode
        - existingFoodId
        - existingFoodName
      properties:
        status:
          type: string
          enum:
            - exists
        barcode:
          type: string
        existingFoodId:
          type: string
        existingFoodName:
          type: string

    GetFoodByBarcode200:
      type: object
      required:
        - status
        - item
      properties:
        status:
          type: string
          enum:
            - found
        item:
          $ref: '#/components/schemas/BarcodeLookupItem'

    GetFoodByBarcode422:
      type: object
      required:
        - message
        - item
      properties:
        message:
          type: string
        item:
          $ref: '#/components/schemas/BarcodeLookupItemIncomplete'

    MeResponse:
      type: object
      required:
        - sub
      properties:
        sub:
          type: string
        email:
          type: string
          nullable: true
        username:
          type: string
          nullable: true
        tokenUse:
          type: string
          nullable: true

    DeleteFoodResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - deleted
            - blocked
        recipeCount:
          type: number
        recipes:
          type: array
          items:
            type: object
            required:
              - id
              - name
            properties:
              id:
                type: string
              name:
                type: string

    AiSuggestionRequest:
      type: object
      required:
        - mode
        - nutritionScore
        - todayMeals
        - todayTotals
        - dailyCalorieTarget
        - dailyMacroTarget
        - remainingCalories
        - remainingMacros
        - foodsCatalog
        - favoriteDishes
      properties:
        mode:
          type: string
          enum:
            - craving
            - recommended
            - alternate
        focus:
          type: string
          enum:
            - quick
            - protein
            - snack
            - light-dinner
            - dessert-fit
          nullable: true
        nutritionScore:
          type: number
        todayMeals:
          type: array
          items:
            $ref: '#/components/schemas/MealLogEntry'
        todayTotals:
          $ref: '#/components/schemas/MacroNutrients'
        dailyCalorieTarget:
          type: number
        dailyMacroTarget:
          $ref: '#/components/schemas/MacroNutrients'
        remainingCalories:
          type: number
        remainingMacros:
          $ref: '#/components/schemas/MacroNutrients'
        foodsCatalog:
          type: array
          items:
            $ref: '#/components/schemas/Food'
        favoriteDishes:
          type: array
          items:
            $ref: '#/components/schemas/FavoriteDish'
        requestId:
          type: string
          nullable: true

    AiSuggestion:
      type: object
      required:
        - id
        - title
        - description
        - whyItFits
        - estimatedCalories
        - estimatedMacros
        - items
        - foodNames
        - sourceKind
        - sourceLabel
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        whyItFits:
          type: string
        estimatedCalories:
          type: number
        estimatedMacros:
          $ref: '#/components/schemas/MacroNutrients'
        items:
          type: array
          items:
            $ref: '#/components/schemas/FavoriteDishItem'
        foodNames:
          type: array
          items:
            type: string
        sourceKind:
          type: string
          enum:
            - foods-only
            - favorite-adaptation
